<!doctype html><html><head><meta charset="utf-8"><title>Обложка YouTube</title>
<link rel="stylesheet" href="../lib/style.css">
<script src="../lib/gsap.min.js"></script><script src="../lib/voicedata.js"></script>
<script src="../lib/engine.js"></script><script src="../lib/chars.js"></script><script src="../lib/sound.js"></script>
<script src="../lib/hud.js"></script><script src="../lib/sets.js"></script></head>
<body><div id="root"></div><script>
// обложка в композиции WARDOGS: логотип слева, крупный персонаж справа, взрыв за спиной
const CENS = location.hash === "#cens";
const tl = E.init({ duration: 1 }); E.ov.grain = 0.05; E.ov.vig = 0.6;
const sky = E.layer("sky", 0); sky.style.cssText += "width:1920px;height:1080px;background:linear-gradient(180deg,#B9772E 0%,#E7A955 30%,#F5D9A0 55%,#E8A04A 72%,#5A3518 100%)";
const sun = E.layer("sun", 0); SET.sun(sun, 1250, 560, 700, "rgba(255,244,214,0.95)");
const far = E.layer("far", 0, { blur: 3 });
let fs = SET.hills(1920, 760, 80, 1.3, "#B07A44") + SET.hills(1920, 820, 60, 4.1, "#8E5E33");
[300, 900, 1600].forEach((x) => fs += SET.pylon(x, 800, 330, "#6E4826", 5)); fs += SET.wires(300, 900, 500, 60, "#6E4826") + SET.wires(900, 1600, 515, 70, "#6E4826");
SET.svg(far, 1920, 1080, fs);
const hl = E.layer("heli", 0, { blur: 1.2 }); [[620, 170, 0.5], [1050, 120, 0.32]].forEach(([x, y, s]) => SET.svg(hl, 700, 300, `<g transform="translate(350,150) scale(${s})">${SET.heli("#3A2616")}</g>`, { x: x - 350, y: y - 150 }));
E.fxLayer("fxB", 0); E.fx("fxB", -0.55, "explosion", { x: 1350, y: 760, size: 2.4, seed: 3 });
E.fxLayer("sm", 0); E.fx("sm", -30, "smokeColumn", { x: 200, y: 780, size: 1.3, seed: 2, color: "92,64,40" });
const ground = E.layer("ground", 0); SET.svg(ground, 1920, 1080, SET.hills(1920, 975, 30, 9.1, "#2B1C10"));
const mid = E.layer("mid", 0);
// Глух с мигающей батареей за спиной Шмидта — комедийный крючок
const glu = C.make("gluh", mid, { x: 1300, y: 1210, sc: 1.25, seed: 5 }); glu.give("R", "battery");
Object.assign(glu.st, { armRu: 40, armRl: 115, armLu: 40, armLl: 115, smile: 1, turn: -0.3, px: -0.6, head: -6 });
const sch = C.make("schmidt", mid, { x: 1640, y: 1700, sc: 2.55, seed: 1 });
Object.assign(sch.st, { turn: -0.25, px: -0.9, eyeWide: 1.3, brow: 1, smile: -0.7, mouthOpen: 0.35, twitch: 0, soot: 0.5, tear: 0 });
sch.wrap.style.filter = "drop-shadow(-16px 0 0 rgba(255,214,140,0.35))";
const fx = E.fxLayer("fx", 0); E.fx("fx", 0, "motes", { n: 60, color: "255,190,110", a: 0.8, size: 4 });
const word = CENS ? "Х*ЙНЮ" : "ХУЙНЮ";
H.el(`<div class="tag y" style="font-size:64px;display:inline-block">ОПЕРАЦИЯ</div>
 <div class="logo" style="font-size:270px;margin-top:20px;text-shadow:0 10px 0 rgba(0,0,0,.45),0 0 40px rgba(0,0,0,.5)">${word}</div>
 <div class="logo" style="font-size:168px;margin-top:4px;text-shadow:0 8px 0 rgba(0,0,0,.45),0 0 40px rgba(0,0,0,.5)">НЕ ТВОРИТЬ</div>
 <div style="display:flex;gap:22px;margin-top:34px;align-items:center"><div class="tag w" style="font-size:56px;text-shadow:0 4px 0 rgba(0,0,0,.5)">ТАКТИЧЕСКИЙ</div><div class="tag y" style="font-size:56px">ПОЛНЫЙ ПРОВАЛ</div></div>
 <div class="box" style="font-size:66px;display:inline-block;margin-top:56px;background:rgba(11,9,6,.35)">МУЛЬТФИЛЬМ · 18+</div>`, { left: "90px", top: "120px" });
E.frame(); tl.seek(0.5, false);
</script></body></html>
