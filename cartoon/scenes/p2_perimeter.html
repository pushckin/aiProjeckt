// ── Грейвс на крыше ──
const TG = 3.2;
tl.set(E.cam, { cx: 3700, cy: 90, s: 1.45, r: 0 }, TG);

E.say(gra, "s2a", T2A); H.radio(T2A, "s2a", "ГРЕЙВС");
// нырок в прицел → вид через оптику на часового
const scopeX = 3800 - 170, scopeY = 300;

tl.to(E.ov, { blur: 6, duration: 0.2 }, TSC - 0.2);
tl.set(E.cam, { cx: 830, cy: 640, s: 2.0, r: 0 }, TSC);

tl.to(scope, { opacity: 1, duration: 0.01 }, TSC);

// ── Шмидт крадётся с ножом ──
tl.set(E.cam, { cx: 1180, cy: 600, s: 1.4, r: 0 }, T2B - 0.2);
E.say(sch, "s2b", T2B); H.radio(T2B, "s2b", "ШМИДТ");

C.pose(sch, TSNEAK - 0.2, { turn: -0.4, px: -0.8 }, 0.4, "power2.inOut");
C.walk(sch, TSNEAK, 1000, T2C - TSNEAK + 0.3, { stride: 70, ease: "sine.inOut" });
E.camTo(TSNEAK + 0.1, { cx: 920, cy: 600, s: 1.25, r: -0.5 }, T2C - TSNEAK - 0.3, "sine.inOut");
E.sfx(TSNEAK, "steps", { n: 7, dt: 0.48, gain: 0.05 });

// ── Бублик вылетает из кустов ──
tl.to(bub.st, { op: 1, duration: 0.01 }, T2C - 0.1);
bub.st.y = 1180; tl.to(bub.st, { y: 985, duration: 0.35, ease: "back.out(1.7)" }, T2C - 0.1);

// удар факелом

E.camTo(TWHACK + 0.15, { cx: 860, cy: 620, s: 1.2, r: 0 }, 0.9, "power2.inOut");
